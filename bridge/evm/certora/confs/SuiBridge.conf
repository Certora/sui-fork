{
    "assert_autofinder_success": true,
    "files": [
        "certora/harnesses/SuiBridgeHarness.sol",
        "contracts/BridgeCommittee.sol",
        "contracts/BridgeConfig.sol",
        "contracts/BridgeLimiter.sol",
        "contracts/BridgeVault.sol",
        "certora/harnesses/BridgeUtilsHarness.sol",
        "certora/harnesses/StorageExtension.sol",
        "certora/mocks/WETH9.sol",
    ],
    "global_timeout": "7200",
    "link": [
        "BridgeCommittee:committee=BridgeCommittee",
        "BridgeCommittee:config=BridgeConfig",
        "BridgeConfig:committee=BridgeCommittee",
        "BridgeLimiter:committee=BridgeCommittee",
        "BridgeVault:wETH=WETH9",
        "SuiBridgeHarness:vault=BridgeVault",
        "SuiBridgeHarness:committee=BridgeCommittee",
        "SuiBridgeHarness:limiter=BridgeLimiter",
    ],
    "msg": "SuiBridge rules",
    "mutations": {
        "gambit": [
            {
                "filename": "contracts/SuiBridge.sol",
                "num_mutants": 5
            }
        ]
    },
    "optimistic_hashing": true,
    "optimistic_fallback": true,
    "optimistic_loop": true,
    "hashing_length_bound": "94",
    "loop_iter": "2",
    "packages": [
        "@forge-std=dependencies/forge-std-1.9.2/src",
        "@openzeppelin/foundry-upgrades=dependencies/openzeppelin-foundry-upgrades-0.3.1/src",
        "@openzeppelin/contracts=dependencies/@openzeppelin-contracts-5.0.1",
        "@openzeppelin/contracts-upgradeable=dependencies/@openzeppelin-contracts-upgradeable-5.0.1",
        "@forge-std-1.9.2=dependencies/forge-std-1.9.2",
        "@openzeppelin-foundry-upgrades-0.3.1=dependencies/openzeppelin-foundry-upgrades-0.3.1",
        "@openzeppelin-contracts-upgradeable-5.0.1=dependencies/@openzeppelin-contracts-upgradeable-5.0.1",
        "@openzeppelin-contracts-5.0.1=dependencies/@openzeppelin-contracts-5.0.1"
    ],
    "process": "emv",
    "prover_args": [
        "-cvlFunctionRevert true"
    ],
    "compiler_map": {
        "WETH9": "solc4.24",
        "SuiBridgeHarness": "solc8.20",
        "BridgeCommittee": "solc8.20",
        "BridgeConfig": "solc8.20",
        "BridgeLimiter": "solc8.20",
        "BridgeVault": "solc8.20",
        "BridgeUtilsHarness": "solc8.20",
        "StorageExtension": "solc8.20",
        "PayableMock": "solc8.20",
        "MockWBTC": "solc8.20",
        "MockUSDC": "solc8.20",
        "MockUSDT": "solc8.20",
    },
    "exclude_method": [ "BridgeCommittee.initializeConfig(address)" ],
    "solc_via_ir": false,
    //"storage_extension_harnesses": [ "SuiBridge=StorageExtension" ],
    "storage_extension_annotation": true,
    "extract_storage_extension_annotation": true,
    "verify": "SuiBridgeHarness:certora/specs/SuiBridge.spec"
}
